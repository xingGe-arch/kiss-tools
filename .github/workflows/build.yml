name: build

# 打 v* 标签时自动打包两个 exe 并作为 Release 附件上传；也可在 Actions 页面手动触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow requests

      - name: Build Kiss Scan
        run: pyinstaller --noconfirm --clean --distpath out "Kiss Scan.spec"

      - name: Build Port Scan
        run: pyinstaller --noconfirm --clean --distpath out "端口扫描.spec"

      - name: List build output
        run: Get-ChildItem -Recurse out | Select-Object FullName, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiss-tools-windows-exe
          path: out/*.exe
          if-no-files-found: error

      - name: Attach executables to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          generate_release_notes: true
